<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action }} Category - Inventory Billing System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        :root { --primary: #667eea; --secondary: #764ba2; --dark: #2c3e50; }
        body { background: #f5f7fa; min-height: 100vh; }
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100%; background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%); padding: 20px; z-index: 100; }
        .sidebar-logo { text-align: center; padding: 20px 0 30px; }
        .sidebar-logo .icon { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border-radius: 15px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .sidebar-logo .icon i { font-size: 28px; color: white; }
        .sidebar-logo h2 { color: white; font-size: 18px; font-weight: 600; }
        .nav-menu { list-style: none; }
        .nav-menu li { margin-bottom: 8px; }
        .nav-menu a { display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: rgba(255,255,255,0.8); text-decoration: none; border-radius: 12px; transition: all 0.3s; font-size: 15px; }
        .nav-menu a:hover, .nav-menu a.active { background: rgba(255,255,255,0.2); color: white; }
        .main-content { margin-left: 260px; padding: 30px; }
        .header h1 { color: var(--dark); font-size: 28px; font-weight: 700; margin-bottom: 30px; }
        .btn { padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: 500; transition: all 0.3s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-secondary { background: #95a5a6; color: white; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 500px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #555; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .form-group input, .form-group textarea { width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 14px; transition: all 0.3s; background: #f8f9fa; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); background: #fff; }
        .form-actions { display: flex; gap: 15px; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="icon"><i class="fas fa-boxes-stacked"></i></div>
            <h2>Inventory System</h2>
        </div>
        <ul class="nav-menu">
            <li><a href="{% url 'dashboard' %}"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="/billing/"><i class="fas fa-calculator"></i> Billing</a></li>
            <li><a href="{% url 'product_list' %}"><i class="fas fa-box"></i> Products</a></li>
            <li><a href="{% url 'category_list' %}" class="active"><i class="fas fa-tags"></i> Categories</a></li>
            <li><a href="{% url 'customer_list' %}"><i class="fas fa-users"></i> Customers</a></li>
            <li><a href="{% url 'invoice_list' %}"><i class="fas fa-file-invoice"></i> Invoices</a></li>
            <li><a href="{% url 'logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </div>
    <div class="main-content">
        <h1>{{ action }} Category</h1>
        <div class="card">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Category Name *</label>
                    <input type="text" name="name" value="{{ category.name|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="3">{{ category.description|default:'' }}</textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {{ action }} Category</button>
                    <a href="{% url 'category_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
